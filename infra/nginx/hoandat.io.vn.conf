# .65: /etc/nginx/conf.d/hoandat.io.vn.conf. Cloudflare (proxied, SSL "full", Universal SSL covers *.hoandat.io.vn)
# -> here. Every user site is static files: SITES_DIR/<name>/current -> releases/<id> (packages/publish). nginx opens
# files per request (no open_file_cache), so a publish that swaps `current` is live on the next request.
#
# Nothing here sets a cookie: user sites run their own JavaScript on hoandat.io.vn, and the app with its session lives
# on trang.hoandat.com, a different site.

server {
    listen 80;
    listen [::]:80;
    server_name hoandat.io.vn *.hoandat.io.vn;
    return 301 https://$host$request_uri;
}

# The bare domain has no site of its own: send people to the app.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hoandat.io.vn;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    return 302 https://trang.hoandat.com/;
}

# One user site per name. Same shape as SITE_NAME_PATTERN in packages/db/src/site-name.ts.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~^(?<site>[a-z0-9][a-z0-9-]{1,28}[a-z0-9])\.hoandat\.io\.vn$";

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/hoandat.io.vn.access.log;
    error_log  /var/log/nginx/hoandat.io.vn.error.log;

    root /var/www/trang/sites/$site/current;
    index index.html;
    disable_symlinks off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # A site's own 404.html when it has one, else the shared one. A site that does not exist gets the shared one too.
    error_page 404 /404.html;
    location = /404.html {
        try_files /404.html @trang_404;
    }
    location @trang_404 {
        root /var/www/trang/static;
        try_files /404.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hidden files (.git, .env) are never served even if a build leaves them in its output.
    location ~ /\. {
        return 404;
    }
}

# Any other name under the domain (too short, too long, two labels deep) must not fall through to another app's
# server block, which nginx would otherwise pick as the default for :443.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~\.hoandat\.io\.vn$";

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    root /var/www/trang/static;
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location / {
        return 404;
    }
}
