# .65: /etc/nginx/conf.d/hoandat.io.vn.conf. Cloudflare (proxied, SSL "full", Universal SSL covers *.hoandat.io.vn)
# -> here. Every user site is static files: SITES_DIR/<name>/current -> releases/<id> (packages/publish). nginx opens
# files per request (no open_file_cache), so a publish that swaps `current` is live on the next request.
#
# Nothing here sets a cookie: user sites run their own JavaScript on hoandat.io.vn, and the app with its session lives
# on webnhanh.hoandat.com, a different site.

# Photos of template pages are named by upload id and width and never change: cache them for a year. Anything else
# (pages, files of developer builds) may change on the next publish: five minutes.
map $uri $webnhanh_site_cache {
    "~^/img/[0-9a-f-]{36}-[0-9]+\.webp$" "public, max-age=31536000, immutable, no-transform";
    default "public, max-age=300, no-transform";
}

server {
    listen 80;
    listen [::]:80;
    server_name hoandat.io.vn *.hoandat.io.vn;
    return 301 https://$host$request_uri;
}

# The bare domain has no site of its own: send people to the app.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hoandat.io.vn;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    return 302 https://webnhanh.hoandat.com/;
}

# One user site per name. Same shape as SITE_NAME_PATTERN in packages/db/src/site-name.ts.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~^(?<site>[a-z0-9][a-z0-9-]{1,28}[a-z0-9])\.hoandat\.io\.vn$";

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/hoandat.io.vn.access.log;
    error_log  /var/log/nginx/hoandat.io.vn.error.log;

    root /var/www/webnhanh/sites/$site/current;
    index index.html;
    disable_symlinks off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # no-transform keeps Cloudflare from injecting its analytics script into people's pages.
    add_header Cache-Control $webnhanh_site_cache always;

    # Where to report any site, whatever its owner put in it (developer sites included): the app's public report form
    # with the site's name filled in. A redirect, so nothing is served from the site's files and no cookie is set.
    # Exact match: it wins over the hidden-files rule below.
    location = /.well-known/report {
        add_header Cache-Control "public, max-age=3600" always;
        return 302 https://webnhanh.hoandat.com/bao-cao?site=$site;
    }

    # Browsers ask for it even when a page names no icon; answer without a 404.
    location = /favicon.ico {
        try_files $uri =204;
        access_log off;
        log_not_found off;
    }

    # A site's own 404.html when it has one, else the shared one. A site that does not exist gets the shared one too.
    error_page 404 /404.html;
    location = /404.html {
        try_files /404.html @webnhanh_404;
    }
    location @webnhanh_404 {
        root /var/www/webnhanh/static;
        try_files /404.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hidden files (.git, .env) are never served even if a build leaves them in its output.
    location ~ /\. {
        return 404;
    }
}

# Any other name under the domain (too short, too long, two labels deep) must not fall through to another app's
# server block, which nginx would otherwise pick as the default for :443.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~\.hoandat\.io\.vn$";

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    root /var/www/webnhanh/static;
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location / {
        return 404;
    }
}
