# .65: /etc/nginx/conf.d/webnhanh.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here, with the shared origin
# certificate. The web app is static (the build in /var/www/webnhanh/app/apps/web/dist); /api, /auth and /healthz go to
# the Node server on loopback :4860, and so do /f/ (orders from the forms of published pages) and /hooks/chat (the
# Chat bot's webhook). User sites are another server block (hoandat.io.vn.conf), on another site.
#
# The app lived at trang.hoandat.com until 28/10/2026; that name is served here too (last two server blocks), so the
# old file /etc/nginx/conf.d/trang.hoandat.com.conf must go when this one is installed (infra/deploy.sh does both).

server {
    listen 80;
    listen [::]:80;
    server_name webnhanh.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webnhanh.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/webnhanh.hoandat.com.access.log;
    error_log  /var/log/nginx/webnhanh.hoandat.com.error.log;

    # The visitor's address from Cloudflare: without it $remote_addr is the Cloudflare edge, and the per-IP limit of
    # /f/ would count a Cloudflare node instead of a person; X-Forwarded-For below then carries the visitor's address.
    # The server does not set real_ip globally. Ranges from https://www.cloudflare.com/ips (28/10/2026): update them
    # when that list changes.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    root /var/www/webnhanh/app/apps/web/dist;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # Small bodies everywhere but the photo upload (below).
    client_max_body_size 64k;

    # script-src: the Vite bundle, plus the hash of the inline theme script of @achoo254/app-shell
    # (apps/web/src/theme-bootstrap.ts; theme-bootstrap.test.ts fails with the new hash when the package changes it).
    # Cloudflare Web Analytics: the zone injects its beacon (no cookies), as on the other hoandat.com apps.
    # style-src 'unsafe-inline': React may set style attributes; no inline <style> or script otherwise.
    # img-src *.hoandat.io.vn: the share picture of a developer site, shown when its build is done (a picture only).
    set $webnhanh_csp "default-src 'self'; script-src 'self' 'sha256-W9/tca6Yh7sgi9+q1Clkh5gvreB7a4KSyZY2skq/pLQ=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.hoandat.io.vn; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location = /healthz {
        proxy_pass http://127.0.0.1:4860;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:4860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Photo upload of the editor: up to 5 MB (the server refuses more), a little room for the request itself.
    location ~ ^/api/sites/[0-9a-f-]+/images$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:4860;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Source zip of a developer site: up to 100 MB (the server counts the bytes and refuses more), streamed to the
    # server as it arrives rather than buffered here.
    location ~ ^/api/sites/[0-9a-f-]+/zip$ {
        client_max_body_size 101m;
        proxy_pass http://127.0.0.1:4860;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Pushes from GitHub and GitLab, checked with each site's own webhook secret by the server.
    location /hooks/git/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:4860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Orders from the form of a published page (https://<site>.hoandat.io.vn): the server answers CORS for that one
    # origin, checks the page's token and limits per IP and per site; bodies are small form posts.
    location /f/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Updates of the order bot from the Chat app, signed with HMAC (checked by the server).
    location = /hooks/chat {
        proxy_pass http://127.0.0.1:4860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Vite fingerprints everything under /assets/: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $webnhanh_csp always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The single-page app: every other path is index.html, never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $webnhanh_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
# The old address: everything goes to the same path on webnhanh.hoandat.com. No page published under the old name
# carried an order form, and the Chat bot was registered after the rename, so nothing needs to be served here.
server {
    listen 80;
    listen [::]:80;
    server_name trang.hoandat.com;
    return 301 https://webnhanh.hoandat.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name trang.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    return 301 https://webnhanh.hoandat.com$request_uri;
}
